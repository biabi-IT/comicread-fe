<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teman - ComicRead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body data-page="teman">
    <nav class="navbar bg-body-tertiary border-bottom px-3">
        <a class="navbar-brand brand mb-0" href="dashboard.html"><span class="brand-mark">Comic</span> Read</a>
        <a href="login.html" class="btn btn-outline-secondary btn-sm" id="logout">Logout</a>
    </nav>
    <div class="container my-4">
        <div class="row">
            <div class="col-md-2 mb-3">
                <div class="list-group">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="genre.html" class="list-group-item list-group-item-action">Genre</a>
                    <a href="koleksi.html" class="list-group-item list-group-item-action">Koleksi</a>
                    <a href="teman.html" class="list-group-item list-group-item-action active"
                        aria-current="page">Teman</a>
                    <a href="peminjaman.html" class="list-group-item list-group-item-action">Peminjaman</a>
                    <a href="laporan.html" class="list-group-item list-group-item-action">Laporan</a>
                </div>
            </div>
            <main class="col-md-10" id="content">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Teman</h4><button class="btn btn-comic" onclick="openForm('teman')">+ Tambah
                        teman</button>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col"><input id="qTeman" class="form-control" placeholder="Cari teman..."></div>
                </div>
                <div class="card ">
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Nama</th>
                                <th>No. HP</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tTeman"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <div class="modal fade" id="m-teman" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="f-teman" data-ent="teman">
                <div class="modal-header">
                    <h5 class="modal-title fs-6 fw-semibold">Form teman</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><input type="hidden" name="_id">
                    <div class="mb-3"><label class="form-label">Nama teman</label><input type="text" name="nama"
                            class="form-control" placeholder="" required></div>
                    <div class="mb-3"><label class="form-label">No. HP</label><input type="text" name="hp"
                            class="form-control" placeholder="" required></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Batal</button><button class="btn btn-comic">Simpan</button></div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
