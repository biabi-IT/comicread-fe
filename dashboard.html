<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - ComicRead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body data-page="dashboard">
    <nav class="navbar bg-body-tertiary border-bottom px-3">
        <a class="navbar-brand brand mb-0" href="dashboard.html"><span class="brand-mark">Comic</span> Read</a>
        <a href="login.html" class="btn btn-outline-secondary btn-sm" id="logout">Logout</a>
    </nav>
    <div class="container my-4">
        <div class="row">
            <div class="col-md-2 mb-3">
                <div class="list-group">
                    <a href="dashboard.html" class="list-group-item list-group-item-action active"
                        aria-current="page">Dashboard</a>
                    <a href="genre.html" class="list-group-item list-group-item-action">Genre</a>
                    <a href="koleksi.html" class="list-group-item list-group-item-action">Koleksi</a>
                    <a href="teman.html" class="list-group-item list-group-item-action">Teman</a>
                    <a href="peminjaman.html" class="list-group-item list-group-item-action">Peminjaman</a>
                    <a href="laporan.html" class="list-group-item list-group-item-action">Laporan</a>
                </div>
            </div>
            <main class="col-md-10" id="content">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Dashboard</h4>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6 col-lg-3">
                        <div class="card p-3"><span class="text-muted">Total koleksi</span><b class="fs-5"
                                id="stTotal">0</b></div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="card p-3"><span class="text-muted">Tersedia</span><b class="fs-5" id="stSedia">0</b>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="card p-3"><span class="text-muted">Sedang dipinjam</span><b class="fs-5"
                                id="stPinjam">0</b></div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="card p-3"><span class="text-muted">Teman</span><b class="fs-5" id="stTeman">0</b>
                        </div>
                    </div>
                </div>
                <div class="card ">
                    <div class="card-header">Sedang dipinjam</div>
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Koleksi</th>
                                <th>Teman</th>
                                <th>Sejak</th>
                            </tr>
                        </thead>
                        <tbody id="tDash"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
