<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk - ComicRead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body data-page="login">
    <div class="auth-wrap">
        <div class="card auth-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="brand fs-4"><span class="brand-mark">Comic</span> Read</div><small
                        class="text-muted">Masuk untuk mengelola koleksimu</small>
                </div>
                <form id="loginForm">
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email"
                            class="form-control" placeholder="masukkan email anda" required></div>
                    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password"
                            class="form-control" placeholder="masukkan password anda" required></div>
                    <button class="btn btn-comic w-100 mt-2">Masuk</button>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">Belum punya akun? <a href="daftar.html">Daftar di
                        sini</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
