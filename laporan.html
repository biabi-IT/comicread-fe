<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laporan - ComicRead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body data-page="laporan">
    <nav class="navbar bg-body-tertiary border-bottom px-3">
        <a class="navbar-brand brand mb-0" href="dashboard.html"><span class="brand-mark">Comic</span> Read</a>
        <a href="login.html" class="btn btn-outline-secondary btn-sm" id="logout">Logout</a>
    </nav>
    <div class="container my-4">
        <div class="row">
            <div class="col-md-2 mb-3">
                <div class="list-group">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="genre.html" class="list-group-item list-group-item-action">Genre</a>
                    <a href="koleksi.html" class="list-group-item list-group-item-action">Koleksi</a>
                    <a href="teman.html" class="list-group-item list-group-item-action">Teman</a>
                    <a href="peminjaman.html" class="list-group-item list-group-item-action">Peminjaman</a>
                    <a href="laporan.html" class="list-group-item list-group-item-action active"
                        aria-current="page">Laporan</a>
                </div>
            </div>
            <main class="col-md-10" id="content">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Laporan</h4>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md"><select id="rGenre" class="form-select"></select></div>
                    <div class="col-md"><select id="rStatus" class="form-select">
                            <option value="">Semua status</option>
                            <option>Tersedia</option>
                            <option>Dipinjam</option>
                        </select></div>
                    <div class="col-md"><select id="rTeman" class="form-select"></select></div>
                    <div class="col-md"><input type="date" id="rDari" class="form-control"></div>
                    <div class="col-md"><input type="date" id="rSampai" class="form-control"></div>
                    <div class="col-md-auto"><button class="btn btn-comic" id="btnLap">Tampilkan</button></div>
                </div>
                <div class="card mb-4">
                    <div class="card-header">Rekap Koleksi</div>
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Judul</th>
                                <th>Genre</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="rRekap"></tbody>
                    </table>
                </div>
                <div class="card mb-4">
                    <div class="card-header">Buku Dipinjam</div>
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Judul</th>
                                <th>Penulis</th>
                                <th>Volume</th>
                                <th>Tahun</th>
                                <th>Genre</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="rBuku"></tbody>
                    </table>
                </div>
                <div class="card ">
                    <div class="card-header">Riwayat peminjaman</div>
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Judul</th>
                                <th>Penulis</th>
                                <th>Volume</th>
                                <th>Tahun</th>
                                <th>Genre</th>
                                <th>Tanggal Pinjam</th>
                                <th>Tanggal Kembali</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="rRiwayat"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
