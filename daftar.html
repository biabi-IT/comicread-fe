<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar - ComicRead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body data-page="daftar">
    <div class="auth-wrap">
        <div class="card auth-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="brand fs-4"><span class="brand-mark">Comic</span> Read</div><small
                        class="text-muted">Buat akun baru</small>
                </div>
                <form id="registerForm">
                    <div class="mb-3"><label class="form-label">Nama lengkap</label><input type="text" name="nama"
                            class="form-control" placeholder="masukkan nama lengkap anda" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email"
                            class="form-control" placeholder="masukkan email anda" required></div>
                    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password"
                            class="form-control" placeholder="minimal 6 karakter" minlength="6" required></div>
                    <div class="mb-3"><label class="form-label">Alamat</label><input type="text" name="alamat"
                            class="form-control" placeholder="masukkan alamat lengkap anda" required></div>
                    <div class="mb-3"><label class="form-label">No HP</label><input type="text" name="hp"
                            class="form-control" placeholder="masukkan No HP anda" required></div>
                    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="setuju"
                            required><label class="form-check-label" for="setuju">Saya setuju dengan syarat dan
                            ketentuan</label></div>
                    <button class="btn btn-comic w-100">Daftar</button>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">Sudah punya akun? <a href="login.html">Masuk</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
