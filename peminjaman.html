<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peminjaman - ComicRead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body data-page="peminjaman">
    <nav class="navbar bg-body-tertiary border-bottom px-3">
        <a class="navbar-brand brand mb-0" href="dashboard.html"><span class="brand-mark">Comic</span> Read</a>
        <a href="login.html" class="btn btn-outline-secondary btn-sm" id="logout">Logout</a>
    </nav>
    <div class="container my-4">
        <div class="row">
            <div class="col-md-2 mb-3">
                <div class="list-group">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="genre.html" class="list-group-item list-group-item-action">Genre</a>
                    <a href="koleksi.html" class="list-group-item list-group-item-action">Koleksi</a>
                    <a href="teman.html" class="list-group-item list-group-item-action">Teman</a>
                    <a href="peminjaman.html" class="list-group-item list-group-item-action active"
                        aria-current="page">Peminjaman</a>
                    <a href="laporan.html" class="list-group-item list-group-item-action">Laporan</a>
                </div>
            </div>
            <main class="col-md-10" id="content">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Peminjaman</h4><button class="btn btn-comic" onclick="openForm('pinjam')">+ Tambah
                        peminjaman</button>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col"><input id="qPinjam" class="form-control" placeholder="Cari peminjaman..."></div>
                    <div class="col-auto"><select id="sPinjam" class="form-select">
                            <option value="">Semua status</option>
                            <option>Dipinjam</option>
                            <option>Dikembalikan</option>
                        </select></div>
                </div>
                <div class="card ">
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Koleksi</th>
                                <th>Teman</th>
                                <th>Tgl pinjam</th>
                                <th>Tgl kembali</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tPinjam"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <div class="modal fade" id="m-pinjam" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="f-pinjam" data-ent="pinjam">
                <div class="modal-header">
                    <h5 class="modal-title fs-6 fw-semibold">Form peminjaman</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><input type="hidden" name="_id">
                    <div class="mb-3"><label class="form-label">Koleksi (hanya yang tersedia)</label><select
                            name="koleksi" id="pKoleksi" class="form-select" required></select></div>
                    <div class="mb-3"><label class="form-label">Teman</label><select name="teman" id="pTeman"
                            class="form-select" required></select></div>
                    <div class="mb-3"><label class="form-label">Tanggal pinjam</label><input type="date" name="pinjam"
                            class="form-control" placeholder="" required></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Batal</button><button class="btn btn-comic">Simpan</button></div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
